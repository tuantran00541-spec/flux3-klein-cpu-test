name: Qwen-Image-2.1 deep-quant sweep

# Deep-quant sweep (user order 2026-11-27 22:56): own Q4/Q3/Q2 + third-party
# GGUF/FP8 builds, each at baseline (20 steps, CFG 6.0) and stacked
# (EasyCache + 12 steps, the R6 best combo). Separate lane from R6 (speed)
# and from the OpenVINO explore - this workflow + driver touch neither.
# Driver: qwen21-ladder/run_deepquant.py, probes: qwen21-ladder/deepquant-probes.json.
# Reference is always the Q6_K base-20.png from the qwen21-ladder-q8ref artifact.

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'probe group: D1 own Q4, D2 own Q3, D3 own Q2, D4 unsloth Q4+Q3XL, D5 unsloth Q2 + leejet Q2, D6 Turbo deep + FP8'
        required: true
        default: 'D1'
        type: choice
        options: ['D1', 'D2', 'D3', 'D4', 'D5', 'D6']

jobs:
  deepquant:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Disk and CPU check
        run: |
          date +%s > job-start.txt
          df -h .; nproc; free -h; lscpu | head -25

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet "huggingface_hub[cli]" numpy Pillow safetensors ml_dtypes
          python -c "import huggingface_hub, numpy, PIL, safetensors, ml_dtypes; print('deps OK')"

      - name: Build stable-diffusion.cpp (CPU)
        run: |
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp sd.cpp
          cmake -S sd.cpp -B sd.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DSD_WEBP=OFF -DSD_WEBM=OFF
          cmake --build sd.cpp/build --config Release --target sd-cli -j4
          ls -la sd.cpp/build/bin/
          test -x sd.cpp/build/bin/sd-cli || { echo SDCLI MISSING; exit 1; }
          sd.cpp/build/bin/sd-cli --help > sd-cli-help.txt 2>&1 || true
          sd.cpp/build/bin/sd-cli -M convert --help > sd-cli-convert-help.txt 2>&1 || true
          du -sh sd.cpp; df -h .

      - name: Fetch q8ref reference artifact
        # The reference PNG (base-20.png, Q6_K) lives in the
        # qwen21-ladder-q8ref artifact - NOT in any stage0 artifact.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=qwen21-ladder-q8ref&per_page=5" --jq '.artifacts[0].id')
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "ERROR: no qwen21-ladder-q8ref artifact found - dispatch q8ref first"
            exit 1
          fi
          echo "q8ref artifact id: $ART_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > ref.zip
          mkdir -p ref && unzip -o ref.zip -d ref/
          # The artifact is ~5.8 GB, mostly the Q6_K GGUF the sweep
          # re-converts anyway: drop it (and the zip) to protect disk.
          rm -f ref.zip ref/*.gguf
          ls -la ref/
          test -f ref/base-20.png || { echo "ERROR: ref/base-20.png missing"; ls -R ref; exit 1; }

      - name: Run deepquant driver
        run: |
          mkdir -p results
          cp sd-cli-help.txt sd-cli-convert-help.txt results/ 2>/dev/null || true
          echo "group=${{ inputs.group }} ref=ref/base-20.png"
          set +e
          time python qwen21-ladder/run_deepquant.py --group "${{ inputs.group }}" --probes-file qwen21-ladder/deepquant-probes.json --ref ref/base-20.png --out results
          echo "driver exit=$?"
          ls -la results/
          df -h .

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen21-deepquant-${{ inputs.group }}
          path: results/
          if-no-files-found: warn
