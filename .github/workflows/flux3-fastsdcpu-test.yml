name: FLUX 3 Klein FastSD CPU OpenVINO test

on:
  workflow_dispatch:
    inputs:
      run_edit:
        description: 'Run SFX-panel edit test if T2I succeeds'
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_1024:
        description: 'Run 1024x1024 T2I test'
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_opt:
        description: 'Run edit-fidelity optimization (mask-composite + strength sweep + 8 steps)'
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  fastsdcpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Disk and CPU check
        run: |
          df -h
          free -h
          nproc
          lscpu
          echo "--- CPU flags (avx/f16c/amx/fma) ---"
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E 'avx|f16c|amx|fma' | sort -u

      - name: Clone fastsdcpu (code under test)
        run: |
          git clone --depth 1 https://github.com/rupeshs/fastsdcpu.git fastsdcpu-src
          git -C fastsdcpu-src log --oneline -1
          ls fastsdcpu-src/src/backend/openvino/ov_flux3_image_klein_pipeline.py

      - name: Install minimal deps (OpenVINO + tokenizer only, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install "openvino==2026.2.0" "transformers==5.0.0" huggingface_hub numpy Pillow tqdm jinja2
          # NOTE: jinja2 is required — transformers 5.0.0 needs it for
          # tokenizer.apply_chat_template (run 45909994003 failed all 3
          # tests instantly without it, while model load took only 22.3s).
          python -c "import openvino, transformers; print('openvino', openvino.__version__, '| transformers', transformers.__version__)"
          df -h

      - name: Run FastSD CPU OpenVINO INT4 tests
        if: inputs.run_opt != 'true'
        run: |
          python fastsdcpu/run_fastsdcpu.py --out results-fastsdcpu --run-edit "${{ inputs.run_edit }}" --run-1024 "${{ inputs.run_1024 }}" || true
          echo '--- results.json ---'
          cat results-fastsdcpu/results.json 2>/dev/null || echo "no results.json"

      - name: Run edit-fidelity optimization
        if: inputs.run_opt == 'true'
        run: |
          python fastsdcpu/run_fastsdcpu_opt.py --out results-fastsdcpu-opt || true
          echo '--- results.json ---'
          cat results-fastsdcpu-opt/results.json 2>/dev/null || echo "no results.json"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux3-klein-fastsdcpu-results
          path: |
            results-fastsdcpu/
            results-fastsdcpu-opt/
          if-no-files-found: warn
