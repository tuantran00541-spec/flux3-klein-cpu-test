name: FLUX 3 Klein Bonsai (ternary) test

on:
  workflow_dispatch:
    inputs:
      convert_source:
        description: 'Which weights to convert to TQ2: mse = MSE-optimal pre-ternarized (default), amax = converter-native amax TQ2 straight from BF16 (diagnostic: isolates the ternarizer)'
        required: false
        default: 'mse'
        type: choice
        options:
          - mse
          - amax
      mode:
        description: 'standard = original bonsai test (mse/amax TQ2 + Q4 control); diagnose = round-2 diagnostic ladder (gguf-dump + dequant analysis + ternary-F16 + Q3_K/Q2_K controls); fix1 = round-2 fix attempt (fixed fidelity analysis + Q2_K/Q3_K via llama-quantize + ternary-F16 with long timeout)'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - diagnose
          - fix1

jobs:
  bonsai-test:
    if: ${{ inputs.mode == 'standard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Disk and CPU check
        run: |
          date +%s > job-start.txt
          df -h .; nproc; free -h; lscpu | head -25

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # torch comes from the CPU index; the rest must come from PyPI
          # (the CPU index does not host safetensors/numpy/huggingface_hub)
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet safetensors numpy "huggingface_hub[cli]"
          python -c "import torch; print('torch', torch.__version__)"

      - name: Build stable-diffusion.cpp (CPU)
        run: |
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp sd.cpp
          cmake -S sd.cpp -B sd.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DSD_WEBP=OFF -DSD_WEBM=OFF
          cmake --build sd.cpp/build --config Release --target sd-cli -j4
          ls -la sd.cpp/build/bin/
          test -x sd.cpp/build/bin/sd-cli || { echo SDCLI MISSING; exit 1; }
          sd.cpp/build/bin/sd-cli --help > sd-cli-help.txt 2>&1 || true
          grep -iE "cache-mode|llm_vision|offload|threads" sd-cli-help.txt || true
          du -sh sd.cpp; df -h .

      - name: Download models
        run: |
          mkdir -p models results
          hf download ml-resources/flux-3-image-klein-comfy diffusion_models/flux3-image-klein-bf16.safetensors --local-dir models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF Qwen3VL-4B-Instruct-Q4_K_M.gguf --local-dir models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --local-dir models
          hf download ml-resources/flux-3-image-klein-comfy vae/flux2-vae.safetensors --local-dir models
          hf download webmp3/Sakura-FLUX.3-Image-Klein-Comfy-GGUF diffusion_models/Sakura-FLUX.3-Image-Klein-Q4_K_M-3.05GiB.gguf --local-dir models || echo "Q4 download failed (comparison will be skipped)"
          find models -type f | sort
          du -sh models; df -h .

      - name: Ternarize (MSE-optimal, group 256)
        if: ${{ inputs.convert_source != 'amax' }}
        run: |
          set +e
          time timeout 1800 python bonsai/ternarize.py --input models/diffusion_models/flux3-image-klein-bf16.safetensors --output models/flux3-image-klein-ternary.safetensors --scale-rule mse --group 256 --stats-out results/ternarize-stats.json
          echo "ternarize exit=$?"
          ls -la models/
          # a failed/slow ternarize must not leave a partial file behind:
          # the convert step only trusts the ternary file if stats JSON exists
          if [ ! -f results/ternarize-stats.json ]; then rm -f models/flux3-image-klein-ternary.safetensors; echo "no stats JSON -> ternary file discarded"; fi

      - name: Convert to TQ2 GGUF
        run: |
          if [ "${{ inputs.convert_source }}" = "amax" ]; then
            echo "amax-from-bf16 (dispatch input)" > results/convert-source.txt
            SRC=models/diffusion_models/flux3-image-klein-bf16.safetensors
          elif [ -f results/ternarize-stats.json ]; then
            echo "MSE-ternary file present, converting it (values pass through the TQ2 amax quantizer exactly)"
            echo "mse-ternary" > results/convert-source.txt
            SRC=models/flux3-image-klein-ternary.safetensors
          else
            echo "No ternary file: fallback is converter-native amax TQ2 from the original BF16"
            echo "amax-from-bf16" > results/convert-source.txt
            SRC=models/diffusion_models/flux3-image-klein-bf16.safetensors
          fi
          time timeout 900 sd.cpp/build/bin/sd-cli -M convert --diffusion-model "$SRC" --type tq2_0 --tensor-type-rules "modulations=f16,emb_in=f16" -o models/flux3-klein-tq2.gguf
          echo "convert exit=$?"
          ls -la models/

      - name: Generate with TQ2 (sd.cpp)
        run: |
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          echo "cache flag: [$CACHE]"
          START=$(date +%s)
          set +e
          timeout 1500 sd.cpp/build/bin/sd-cli --diffusion-model models/flux3-klein-tq2.gguf --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/bonsai-tq2-512.png -v > results/sdcpp-tq2.log 2>&1
          echo "tq2 exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-tq2.time
          ls -la results/

      - name: Comparison - Q4_K_M via sd.cpp (same prompt)
        if: always()
        run: |
          if [ ! -f models/diffusion_models/Sakura-FLUX.3-Image-Klein-Q4_K_M-3.05GiB.gguf ]; then echo "Q4 file missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          echo "elapsed ${ELAPSED}s"
          if [ "$ELAPSED" -gt 6000 ]; then echo "out of time, skipping Q4 comparison"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 1200 sd.cpp/build/bin/sd-cli --diffusion-model models/diffusion_models/Sakura-FLUX.3-Image-Klein-Q4_K_M-3.05GiB.gguf --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/q4-512.png -v > results/sdcpp-q4.log 2>&1
          echo "q4 exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-q4.time
          ls -la results/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux3-klein-bonsai-results
          path: results/

  # ---- Round-2 diagnostic ladder (mode == 'diagnose') ----
  # Step 1 (gguf-dump: did the FP16 exceptions really stay FP16?) +
  # Step 2 (ternary weights via F16, no quantization at all) +
  # Step 3 (Q3_K / Q2_K controls: is TQ2 specifically broken, or is
  # sub-4-bit too lossy?). One run, no extra dispatch needed.
  diagnose:
    if: ${{ inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Disk and CPU check
        run: |
          date +%s > job-start.txt
          df -h .; nproc; free -h; lscpu | head -25

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet safetensors numpy "huggingface_hub[cli]" gguf
          python -c "import torch; print('torch', torch.__version__)"
          command -v gguf-dump && gguf-dump --help 2>&1 | head -5 || echo "gguf-dump CLI missing (diagnose_gguf.py falls back to gguf-py enum)"

      - name: Build stable-diffusion.cpp (CPU)
        run: |
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp sd.cpp
          cmake -S sd.cpp -B sd.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DSD_WEBP=OFF -DSD_WEBM=OFF
          cmake --build sd.cpp/build --config Release --target sd-cli -j4
          ls -la sd.cpp/build/bin/
          test -x sd.cpp/build/bin/sd-cli || { echo SDCLI MISSING; exit 1; }
          sd.cpp/build/bin/sd-cli --help > sd-cli-help.txt 2>&1 || true
          du -sh sd.cpp; df -h .

      - name: Download models (BF16 + TE + VAE; no Q4 control needed)
        run: |
          mkdir -p models results
          hf download ml-resources/flux-3-image-klein-comfy diffusion_models/flux3-image-klein-bf16.safetensors --local-dir models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF Qwen3VL-4B-Instruct-Q4_K_M.gguf --local-dir models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --local-dir models
          hf download ml-resources/flux-3-image-klein-comfy vae/flux2-vae.safetensors --local-dir models
          find models -type f | sort
          du -sh models; df -h .

      - name: Ternarize (MSE-optimal, group 256) -- same recipe as round 1
        run: |
          set +e
          time timeout 1800 python bonsai/ternarize.py --input models/diffusion_models/flux3-image-klein-bf16.safetensors --output models/flux3-image-klein-ternary.safetensors --scale-rule mse --group 256 --stats-out results/ternarize-stats.json
          echo "ternarize exit=$?"
          ls -la models/
          if [ ! -f results/ternarize-stats.json ]; then rm -f models/flux3-image-klein-ternary.safetensors; echo "no stats JSON -> ternary file discarded"; fi

      - name: "Convert all variants (non-fatal each: one bad type must not kill the job)"
        run: |
          set +e
          SDCLI=sd.cpp/build/bin/sd-cli
          BF16=models/diffusion_models/flux3-image-klein-bf16.safetensors
          TERN=models/flux3-image-klein-ternary.safetensors
          RULES="modulations=f16,emb_in=f16"
          time timeout 900 $SDCLI -M convert --diffusion-model "$BF16" --type tq2_0 --tensor-type-rules "$RULES" -o models/flux3-klein-tq2-amax.gguf
          echo "convert bf16->tq2 exit=$?"
          if [ -f "$TERN" ]; then
            time timeout 900 $SDCLI -M convert --diffusion-model "$TERN" --type tq2_0 --tensor-type-rules "$RULES" -o models/flux3-klein-tq2-mse.gguf
            echo "convert ternary->tq2 exit=$?"
            time timeout 900 $SDCLI -M convert --diffusion-model "$TERN" --type f16 -o models/flux3-klein-ternary-f16.gguf
            echo "convert ternary->f16 exit=$?"
          else
            echo "no ternary file, skipping ternary converts"
          fi
          time timeout 900 $SDCLI -M convert --diffusion-model "$BF16" --type q3_k --tensor-type-rules "$RULES" -o models/flux3-klein-q3k.gguf
          echo "convert bf16->q3_k exit=$?"
          time timeout 900 $SDCLI -M convert --diffusion-model "$BF16" --type q2_k --tensor-type-rules "$RULES" -o models/flux3-klein-q2k.gguf
          echo "convert bf16->q2_k exit=$?"
          time timeout 900 $SDCLI -M convert --diffusion-model "$BF16" --type f16 -o models/flux3-klein-bf16-f16.gguf
          echo "convert bf16->f16 exit=$?"
          ls -la models/

      - name: Dump + dequant analysis (step 1 of the ladder)
        run: |
          set +e
          DUMP="gguf-dump"
          command -v gguf-dump >/dev/null 2>&1 || DUMP="python -m gguf.scripts.gguf_dump"
          for f in tq2-amax tq2-mse q3k q2k ternary-f16 bf16-f16; do
            G=models/flux3-klein-$f.gguf
            [ -f "$G" ] || { echo "$G missing, skipping dump"; continue; }
            $DUMP "$G" > results/dump-$f.txt 2>&1 || echo "dump $f failed"
            echo "--- dump $f: $(grep -c . results/dump-$f.txt 2>/dev/null) lines"
          done
          BF16=models/diffusion_models/flux3-image-klein-bf16.safetensors
          TERN=models/flux3-image-klein-ternary.safetensors
          [ -f models/flux3-klein-tq2-amax.gguf ] && python bonsai/diagnose_gguf.py --gguf models/flux3-klein-tq2-amax.gguf --dump results/dump-tq2-amax.txt --bf16 "$BF16" --out results/diagnose-tq2-amax.json | tee results/diagnose-tq2-amax.log
          if [ -f models/flux3-klein-tq2-mse.gguf ]; then
            python bonsai/diagnose_gguf.py --gguf models/flux3-klein-tq2-mse.gguf --dump results/dump-tq2-mse.txt --bf16 "$BF16" --ternary "$TERN" --out results/diagnose-tq2-mse.json | tee results/diagnose-tq2-mse.log
          fi
          for f in q3k q2k ternary-f16 bf16-f16; do
            [ -f models/flux3-klein-$f.gguf ] && python bonsai/diagnose_gguf.py --gguf models/flux3-klein-$f.gguf --dump results/dump-$f.txt --bf16 "$BF16" --out results/diagnose-$f.json | tee results/diagnose-$f.log || true
          done
          ls -la results/

      - name: "Generate ternary-F16 (step 2: the weights, unquantized)"
        run: |
          G=models/flux3-klein-ternary-f16.gguf
          if [ ! -f "$G" ]; then echo "ternary-F16 missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          if [ "$ELAPSED" -gt 5400 ]; then echo "out of time (${ELAPSED}s), skipping"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 1500 sd.cpp/build/bin/sd-cli --diffusion-model "$G" --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/ternary-f16-512.png -v > results/sdcpp-ternary-f16.log 2>&1
          echo "ternary-f16 exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-ternary-f16.time
          ls -la results/

      - name: Generate Q3_K (step 3a)
        if: always()
        run: |
          G=models/flux3-klein-q3k.gguf
          if [ ! -f "$G" ]; then echo "Q3_K missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          if [ "$ELAPSED" -gt 6000 ]; then echo "out of time (${ELAPSED}s), skipping"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 1500 sd.cpp/build/bin/sd-cli --diffusion-model "$G" --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/q3k-512.png -v > results/sdcpp-q3k.log 2>&1
          echo "q3k exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-q3k.time
          ls -la results/

      - name: Generate Q2_K (step 3b)
        if: always()
        run: |
          G=models/flux3-klein-q2k.gguf
          if [ ! -f "$G" ]; then echo "Q2_K missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          if [ "$ELAPSED" -gt 6300 ]; then echo "out of time (${ELAPSED}s), skipping"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 1500 sd.cpp/build/bin/sd-cli --diffusion-model "$G" --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/q2k-512.png -v > results/sdcpp-q2k.log 2>&1
          echo "q2k exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-q2k.time
          ls -la results/

      - name: Generate BF16-F16 control (proves the F16 path itself works)
        if: always()
        run: |
          G=models/flux3-klein-bf16-f16.gguf
          if [ ! -f "$G" ]; then echo "BF16-F16 missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          if [ "$ELAPSED" -gt 5400 ]; then echo "out of time (${ELAPSED}s), skipping control"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 1500 sd.cpp/build/bin/sd-cli --diffusion-model "$G" --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/bf16-f16-512.png -v > results/sdcpp-bf16-f16.log 2>&1
          echo "bf16-f16 exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-bf16-f16.time
          ls -la results/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux3-klein-bonsai-diagnose
          path: results/

  # ---- Round-2 fix attempt (mode == 'fix1') ----
  # Diagnose run proved: converter types are correct (rules NOT misapplied),
  # sd-cli convert rejects q2_k/q3_k, F16 sampling works but needs >1500s.
  # Fix hypothesis: TQ2's single scale per 256-block is the coarsest
  # possible 2-bit; Q2_K's per-16 sub-block scales are strictly finer
  # (and PrismML uses group 128, not 256). So: Q2_K/Q3_K via the reference
  # llama-quantize, plus the ternary-F16 generation with a 3600s timeout
  # (finally answers whether the ternary weights themselves are usable).
  fix1:
    if: ${{ inputs.mode == 'fix1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Disk and CPU check
        run: |
          date +%s > job-start.txt
          df -h .; nproc; free -h; lscpu | head -25

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet safetensors numpy "huggingface_hub[cli]" gguf
          python -c "import torch; print('torch', torch.__version__)"

      - name: Build stable-diffusion.cpp (CPU)
        run: |
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp sd.cpp
          cmake -S sd.cpp -B sd.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DSD_WEBP=OFF -DSD_WEBM=OFF
          cmake --build sd.cpp/build --config Release --target sd-cli -j4
          test -x sd.cpp/build/bin/sd-cli || { echo SDCLI MISSING; exit 1; }
          sd.cpp/build/bin/sd-cli --help > sd-cli-help.txt 2>&1 || true
          du -sh sd.cpp; df -h .

      - name: Build llama-quantize (reference Q2_K/Q3_K quantizer)
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build llama.cpp/build --config Release --target llama-quantize -j4
          test -x llama.cpp/build/bin/llama-quantize || { echo LLAMA-QUANTIZE MISSING; exit 1; }
          llama.cpp/build/bin/llama-quantize --help > results-llama-quantize-help.txt 2>&1 || true
          mkdir -p results
          mv results-llama-quantize-help.txt results/ 2>/dev/null || true
          grep -i "tensor-type-rules" results/llama-quantize-help.txt && echo "HAS tensor-type-rules" || echo "NO tensor-type-rules in llama-quantize"
          du -sh llama.cpp; df -h .

      - name: Download models (BF16 + TE + VAE; no Q4 control needed)
        run: |
          mkdir -p models results
          hf download ml-resources/flux-3-image-klein-comfy diffusion_models/flux3-image-klein-bf16.safetensors --local-dir models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF Qwen3VL-4B-Instruct-Q4_K_M.gguf --local-dir models
          hf download Qwen/Qwen3-VL-4B-Instruct-GGUF mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --local-dir models
          hf download ml-resources/flux-3-image-klein-comfy vae/flux2-vae.safetensors --local-dir models
          find models -type f | sort
          du -sh models; df -h .

      - name: Ternarize (MSE-optimal, group 256) -- same recipe as round 1
        run: |
          set +e
          time timeout 1800 python bonsai/ternarize.py --input models/diffusion_models/flux3-image-klein-bf16.safetensors --output models/flux3-image-klein-ternary.safetensors --scale-rule mse --group 256 --stats-out results/ternarize-stats.json
          echo "ternarize exit=$?"
          ls -la models/
          if [ ! -f results/ternarize-stats.json ]; then rm -f models/flux3-image-klein-ternary.safetensors; echo "no stats JSON -> ternary file discarded"; fi

      - name: Convert with sd-cli (TQ2 + F16 only; q2_k/q3_k are rejected here)
        run: |
          set +e
          SDCLI=sd.cpp/build/bin/sd-cli
          BF16=models/diffusion_models/flux3-image-klein-bf16.safetensors
          TERN=models/flux3-image-klein-ternary.safetensors
          RULES="modulations=f16,emb_in=f16"
          time timeout 900 $SDCLI -M convert --diffusion-model "$BF16" --type tq2_0 --tensor-type-rules "$RULES" -o models/flux3-klein-tq2-amax.gguf
          echo "convert bf16->tq2 exit=$?"
          if [ -f "$TERN" ]; then
            time timeout 900 $SDCLI -M convert --diffusion-model "$TERN" --type tq2_0 --tensor-type-rules "$RULES" -o models/flux3-klein-tq2-mse.gguf
            echo "convert ternary->tq2 exit=$?"
            time timeout 900 $SDCLI -M convert --diffusion-model "$TERN" --type f16 -o models/flux3-klein-ternary-f16.gguf
            echo "convert ternary->f16 exit=$?"
          else
            echo "no ternary file, skipping ternary converts"
          fi
          time timeout 900 $SDCLI -M convert --diffusion-model "$BF16" --type f16 -o models/flux3-klein-bf16-f16.gguf
          echo "convert bf16->f16 exit=$?"
          ls -la models/

      - name: Fixed fidelity analysis (TQ2 dequant vs reference values)
        run: |
          set +e
          DUMP="gguf-dump"
          command -v gguf-dump >/dev/null 2>&1 || DUMP="python -m gguf.scripts.gguf_dump"
          for f in tq2-amax tq2-mse ternary-f16 bf16-f16; do
            G=models/flux3-klein-$f.gguf
            [ -f "$G" ] || { echo "$G missing, skipping dump"; continue; }
            $DUMP "$G" > results/dump-$f.txt 2>&1 || echo "dump $f failed"
          done
          BF16=models/diffusion_models/flux3-image-klein-bf16.safetensors
          TERN=models/flux3-image-klein-ternary.safetensors
          [ -f models/flux3-klein-tq2-amax.gguf ] && python bonsai/diagnose_gguf.py --gguf models/flux3-klein-tq2-amax.gguf --dump results/dump-tq2-amax.txt --bf16 "$BF16" --out results/diagnose-tq2-amax.json | tee results/diagnose-tq2-amax.log
          if [ -f models/flux3-klein-tq2-mse.gguf ]; then
            python bonsai/diagnose_gguf.py --gguf models/flux3-klein-tq2-mse.gguf --dump results/dump-tq2-mse.txt --bf16 "$BF16" --ternary "$TERN" --out results/diagnose-tq2-mse.json | tee results/diagnose-tq2-mse.log
          fi
          for f in ternary-f16 bf16-f16; do
            [ -f models/flux3-klein-$f.gguf ] && python bonsai/diagnose_gguf.py --gguf models/flux3-klein-$f.gguf --dump results/dump-$f.txt --bf16 "$BF16" --out results/diagnose-$f.json | tee results/diagnose-$f.log || true
          done
          ls -la results/

      - name: Quantize to Q2_K / Q3_K with llama-quantize
        run: |
          set +e
          Q=llama.cpp/build/bin/llama-quantize
          RULES=""
          grep -qi "tensor-type-rules" results/llama-quantize-help.txt && RULES="--tensor-type-rules modulations=f16,emb_in=f16" || true
          echo "rules flag: [$RULES]"
          if [ -f models/flux3-klein-bf16-f16.gguf ]; then
            time timeout 1200 $Q models/flux3-klein-bf16-f16.gguf models/flux3-klein-q2k.gguf Q2_K $RULES
            echo "llama-quantize Q2_K exit=$?"
            time timeout 1200 $Q models/flux3-klein-bf16-f16.gguf models/flux3-klein-q3k.gguf Q3_K $RULES
            echo "llama-quantize Q3_K exit=$?"
          else
            echo "no BF16-F16 GGUF, skipping llama-quantize"
          fi
          ls -la models/
          # inventory: which tensors did llama-quantize actually quantize?
          DUMP="gguf-dump"
          command -v gguf-dump >/dev/null 2>&1 || DUMP="python -m gguf.scripts.gguf_dump"
          for f in q2k q3k; do
            G=models/flux3-klein-$f.gguf
            [ -f "$G" ] || { echo "$G missing, skipping"; continue; }
            $DUMP "$G" > results/dump-$f.txt 2>&1 || echo "dump $f failed"
            python bonsai/diagnose_gguf.py --gguf "$G" --dump results/dump-$f.txt --bf16 models/diffusion_models/flux3-image-klein-bf16.safetensors --out results/diagnose-$f.json | tee results/diagnose-$f.log || true
          done
          ls -la results/

      - name: Generate Q2_K (the fix candidate)
        if: always()
        run: |
          G=models/flux3-klein-q2k.gguf
          if [ ! -f "$G" ]; then echo "Q2_K missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          if [ "$ELAPSED" -gt 4200 ]; then echo "out of time (${ELAPSED}s), skipping"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 1500 sd.cpp/build/bin/sd-cli --diffusion-model "$G" --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/q2k-512.png -v > results/sdcpp-q2k.log 2>&1
          echo "q2k exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-q2k.time
          ls -la results/

      - name: Generate ternary-F16 (step 2, long timeout)
        if: always()
        run: |
          G=models/flux3-klein-ternary-f16.gguf
          if [ ! -f "$G" ]; then echo "ternary-F16 missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          if [ "$ELAPSED" -gt 3300 ]; then echo "out of time (${ELAPSED}s), skipping"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 3600 sd.cpp/build/bin/sd-cli --diffusion-model "$G" --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/ternary-f16-512.png -v > results/sdcpp-ternary-f16.log 2>&1
          echo "ternary-f16 exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-ternary-f16.time
          ls -la results/

      - name: Generate Q3_K (if time remains)
        if: always()
        run: |
          G=models/flux3-klein-q3k.gguf
          if [ ! -f "$G" ]; then echo "Q3_K missing, skipping"; exit 0; fi
          ELAPSED=$(($(date +%s)-$(cat job-start.txt)))
          if [ "$ELAPSED" -gt 6000 ]; then echo "out of time (${ELAPSED}s), skipping"; exit 0; fi
          PROMPT="A detailed anime-style illustration of a young swordsman standing on a misty mountain path at dawn, long black hair tied back, dark blue robes with silver trim, holding a sheathed katana at his side, pine trees and drifting fog in the background, soft golden morning light breaking through the mist, cinematic composition, clean linework, detailed shading."
          CACHE=""
          grep -q "cache-mode" sd-cli-help.txt && CACHE="--cache-mode easycache" || true
          START=$(date +%s)
          set +e
          timeout 1200 sd.cpp/build/bin/sd-cli --diffusion-model "$G" --llm models/Qwen3VL-4B-Instruct-Q4_K_M.gguf --llm_vision models/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --vae models/vae/flux2-vae.safetensors -p "$PROMPT" --cfg-scale 1.0 --steps 16 --sampling-method euler --width 512 --height 512 --threads 4 --offload-to-cpu $CACHE --output results/q3k-512.png -v > results/sdcpp-q3k.log 2>&1
          echo "q3k exit=$? wall=$(($(date +%s)-START))s" | tee results/sdcpp-q3k.time
          ls -la results/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux3-klein-bonsai-fix1
          path: results/
